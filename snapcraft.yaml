name: conga
version: "1.4.3"
title: CONGA
summary: Config generator CLI
description: |
  Build Nginx, Docker Compose, and WireGuard configs without the pain.
license: MIT
contact: https://github.com/pc0stas/conga
issues: https://github.com/pc0stas/conga/issues
source-code: https://github.com/pc0stas/conga
website: https://github.com/pc0stas/conga

base: core22
confinement: strict

apps:
  conga:
    command: bin/conga
    plugs:
      - home
      - network

parts:
  conga:
    plugin: go
    source: .
    build-packages:
      - git
    build-snaps:
      - go
    override-build: |
      craftctl default
      mkdir -p "${SNAPCRAFT_PART_INSTALL}/usr/share/bash-completion/completions"
      mkdir -p "${SNAPCRAFT_PART_INSTALL}/usr/share/zsh/site-functions"
      mkdir -p "${SNAPCRAFT_PART_INSTALL}/usr/share/fish/vendor_completions.d"
      "${SNAPCRAFT_PART_INSTALL}/bin/conga" completion bash > "${SNAPCRAFT_PART_INSTALL}/usr/share/bash-completion/completions/conga"
      "${SNAPCRAFT_PART_INSTALL}/bin/conga" completion zsh > "${SNAPCRAFT_PART_INSTALL}/usr/share/zsh/site-functions/_conga"
      "${SNAPCRAFT_PART_INSTALL}/bin/conga" completion fish > "${SNAPCRAFT_PART_INSTALL}/usr/share/fish/vendor_completions.d/conga.fish"
